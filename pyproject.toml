[project]
name = "creality-mcp"
version = "0.1.0"
description = "creality-mcp: slice 3D models with CrealityPrint from Claude"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.12",
  "pydantic-settings",
  "mcp==2.0.0",
]

[project.scripts]
creality-mcp = "creality_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["creality_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slicer: needs the real CrealityPrint AppImage"]

[tool.ruff]
line-length = 100
target-version = "py313"
include = ["pyproject.toml", "creality_mcp/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
